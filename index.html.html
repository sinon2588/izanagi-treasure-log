<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#203864"><title>イザナギ 宝箱ワンタップ記録</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f6fa;color:#172033;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom));max-width:760px}h1{font-size:1.3rem;margin:4px 0}.lead,.note{font-size:.84rem;line-height:1.5;color:#5c687b}.warning{background:#fff7dc;border:1px solid #ecd68c;border-radius:12px;padding:10px;font-size:.8rem;line-height:1.5}.card,details{background:white;border:1px solid #dfe5ef;border-radius:15px;padding:12px;margin:11px 0}.card h2{font-size:1rem;margin:0 0 9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.stat{background:#f2f5f9;border-radius:10px;padding:8px 3px;text-align:center}.stat small{display:block;color:#657186;font-size:.7rem}.stat b{display:block;font-size:1.15rem;margin-top:3px}.buttons,.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tap{border:0;border-radius:12px;min-height:52px;font:inherit;font-weight:750;touch-action:manipulation}.yes{background:#dff4e5;color:#155b2b}.no{background:#fde8e7;color:#8d2925}.metrics{font-size:.79rem;line-height:1.75;margin-top:9px;color:#344054}.tools{margin:14px 0}.tools button{background:#fff;border:1px solid #d4dce8;border-radius:10px;padding:10px 5px;font:inherit;font-size:.8rem}.status{min-height:1.3em;color:#17603a;font-size:.82rem}summary{font-weight:700}table{width:100%;font-size:.78rem;border-collapse:collapse}td,th{text-align:left;padding:7px 3px;border-bottom:1px solid #e7ebf1}@media(min-width:560px){body{padding:24px}.card{padding:16px}}
</style></head><body>
<h1>宝箱ワンタップ記録</h1><p class="lead">該当する宝箱の「成功」または「失敗」を1回タップするだけで記録できます。</p>
<div class="warning">記録はこのブラウザ内に保存されます。SafariのWebサイトデータを消去すると失われる場合があるため、定期的にバックアップを保存してください。</div>
<div id="cards"></div><div id="status" class="status" aria-live="polite"></div>
<div class="tools"><button id="backup">バックアップ保存</button><button id="restore">バックアップ読込</button><button id="csv">集計CSV保存</button><button id="undo">直前の記録を取消</button></div><input id="file" type="file" accept=".json,application/json" hidden>
<details><summary>最近の記録</summary><p class="note">直近50件を表示。全履歴はバックアップに含まれます。</p><div id="history"></div></details>
<details><summary>数値の見方</summary><p class="note">実測成功率＝成功回数÷試行回数。期待成功回数＝試行回数×理論確率。理論確率との差＝実測成功率−理論確率。95%信頼区間は実測率の不確かさの目安です。</p></details>
<script>
const types=[{id:"g5",label:"金箱・5%",p:.05},{id:"g10",label:"金箱・10%",p:.1},{id:"g15",label:"金箱・15%",p:.15},{id:"f5",label:"花箱・5%",p:.05},{id:"f10",label:"花箱・10%",p:.1},{id:"f15",label:"花箱・15%",p:.15}],KEY="izanagi_treasure_tap_v1";
let logs=[];try{const d=JSON.parse(localStorage.getItem(KEY)||"[]");if(Array.isArray(d))logs=d}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(logs))}catch(e){say("保存できません。バックアップを保存してください。",true)}}
function pct(v){return(v*100).toFixed(2)+"%"}function wilson(s,n){if(!n)return null;const z=1.96,p=s/n,d=1+z*z/n,c=(p+z*z/(2*n))/d,h=z*Math.sqrt((p*(1-p)+z*z/(4*n))/n)/d;return[Math.max(0,c-h),Math.min(1,c+h)]}
function st(t){const a=logs.filter(x=>x.id===t.id),n=a.length,s=a.filter(x=>x.r==="成功").length;return{n,s,f:n-s,rate:n?s/n:null,exp:n*t.p,diff:n?s/n-t.p:null,ci:wilson(s,n)}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function say(s,b=false){const e=document.getElementById("status");e.textContent=s;e.style.color=b?"#9b2929":"#17603a"}
function render(){document.getElementById("cards").innerHTML=types.map(t=>{const x=st(t);return `<section class="card"><h2>${t.label}</h2><div class="stats"><div class="stat"><small>試行回数</small><b>${x.n}</b></div><div class="stat"><small>成功回数</small><b>${x.s}</b></div><div class="stat"><small>失敗回数</small><b>${x.f}</b></div></div><div class="buttons"><button class="tap yes" data-id="${t.id}" data-r="成功">✓ 成功</button><button class="tap no" data-id="${t.id}" data-r="失敗">✕ 失敗</button></div><div class="metrics">実測成功率：<b>${x.rate===null?"—":pct(x.rate)}</b><br>期待成功回数：<b>${x.exp.toFixed(2)}回</b><br>理論確率との差：<b>${x.diff===null?"—":(x.diff>0?"+":"")+(x.diff*100).toFixed(2)+"ポイント"}</b><br>95%信頼区間：<b>${x.ci?pct(x.ci[0])+" ～ "+pct(x.ci[1]):"—"}</b></div></section>`}).join("");
document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{const t=types.find(q=>q.id===b.dataset.id);logs.push({id:t.id,r:b.dataset.r,time:new Date().toISOString()});save();render();say(t.label+"："+b.dataset.r+"を記録しました")});
const recent=logs.slice(-50).reverse();document.getElementById("history").innerHTML=recent.length?'<table><thead><tr><th>日時</th><th>宝箱</th><th>結果</th></tr></thead><tbody>'+recent.map(x=>`<tr><td>${esc(new Date(x.time).toLocaleString("ja-JP"))}</td><td>${esc(types.find(t=>t.id===x.id)?.label||x.id)}</td><td>${x.r==="成功"?"✓ 成功":"✕ 失敗"}</td></tr>`).join("")+'</tbody></table>':'<p class="note">まだ記録はありません。</p>'}
function dl(name,data,type){const u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200)}
document.getElementById("backup").onclick=()=>dl("イザナギ宝箱記録バックアップ.json",JSON.stringify({version:1,logs},null,2),"application/json");
document.getElementById("restore").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.logs))throw Error();if(confirm("現在の記録を読み込んだ内容で置き換えますか？")){logs=d.logs.filter(x=>types.some(t=>t.id===x.id)&&["成功","失敗"].includes(x.r)&&x.time);save();render();say("バックアップを読み込みました")}}catch(err){say("正しいバックアップJSONを選んでください",true)}finally{e.target.value=""}};
document.getElementById("csv").onclick=()=>{const rows=[["箱タイプ","理論確率","試行回数","成功回数","失敗回数","実測成功率","期待成功回数","理論確率との差","95%CI下限","95%CI上限"]];types.forEach(t=>{const x=st(t);rows.push([t.label,t.p,x.n,x.s,x.f,x.rate??"",x.exp,x.diff??"",x.ci?.[0]??"",x.ci?.[1]??""])});dl("イザナギ宝箱開封率集計.csv","\ufeff"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n"),"text/csv;charset=utf-8")};
document.getElementById("undo").onclick=()=>{if(!logs.length)return say("取り消せる記録がありません",true);const x=logs[logs.length-1],t=types.find(q=>q.id===x.id);if(confirm("直前の記録（"+t.label+"・"+x.r+"）を取り消しますか？")){logs.pop();save();render();say("直前の記録を取り消しました")}};
render();
</script></body></html>
